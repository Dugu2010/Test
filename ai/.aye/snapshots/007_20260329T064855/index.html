<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-primary:#0f0f1a;--bg-secondary:#161625;--bg-tertiary:#1e1e32;--bg-sidebar:#0b0b15;--bg-input:#1a1a2e;--bg-hover:#252540;--bg-user-msg:#1e1e3a;--accent:#8b5cf6;--accent-hover:#7c3aed;--accent-dim:rgba(139,92,246,0.15);--text-primary:#e8e8f0;--text-secondary:#9ca3af;--text-muted:#6b7280;--border:#2a2a40;--border-light:#3a3a55;--success:#22c55e;--error:#ef4444;--warning:#f59e0b;--radius:12px;--radius-sm:8px;--radius-lg:16px;--shadow:0 4px 24px rgba(0,0,0,0.3);--transition:0.2s ease;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--font-mono:'SF Mono','Fira Code','JetBrains Mono',monospace;--sidebar-w:280px}
[data-theme="light"]{--bg-primary:#f8f9fc;--bg-secondary:#ffffff;--bg-tertiary:#f0f1f5;--bg-sidebar:#f0f0f5;--bg-input:#ffffff;--bg-hover:#e8e8f0;--bg-user-msg:#e8e8f5;--text-primary:#1a1a2e;--text-secondary:#4b5563;--text-muted:#9ca3af;--border:#e0e0ea;--border-light:#d0d0dd;--shadow:0 4px 24px rgba(0,0,0,0.08)}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg-primary);color:var(--text-primary);display:flex;transition:background var(--transition),color var(--transition)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font);background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;outline:none;transition:border var(--transition)}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all var(--transition)}
.btn-primary{background:var(--accent);color:white}.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{color:var(--text-secondary)}.btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-sm{padding:4px 10px;font-size:12px}
/* Sidebar */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s ease,width .3s ease;z-index:100}
#sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));width:0;min-width:0;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sidebar-logo span{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#new-chat-btn{width:100%;padding:10px;border-radius:var(--radius-sm);border:1px dashed var(--border);color:var(--text-secondary);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all var(--transition)}#new-chat-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.sessions-list{flex:1;overflow-y:auto;padding:8px}
.sessions-list::-webkit-scrollbar{width:4px}.sessions-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.session-item{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;transition:all var(--transition);font-size:13px;color:var(--text-secondary)}
.session-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.session-item.active{background:var(--accent-dim);color:var(--text-primary);border-left:3px solid var(--accent)}
.session-item .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .delete-btn{opacity:0;padding:4px;border-radius:4px;font-size:11px;color:var(--text-muted);transition:all var(--transition)}
.session-item:hover .delete-btn{opacity:1}.session-item .delete-btn:hover{color:var(--error);background:rgba(239,68,68,0.1)}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer button{flex:1;font-size:12px}
/* Main */
#main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
#topbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-secondary);min-height:52px}
#topbar .left{display:flex;align-items:center;gap:12px}
#topbar .right{display:flex;align-items:center;gap:8px}
#toggle-sidebar{font-size:18px;padding:6px;border-radius:6px;transition:all var(--transition)}#toggle-sidebar:hover{background:var(--bg-hover)}
#model-display{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
#model-display .model-name{color:var(--text-primary);font-weight:500}
.auto-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent-dim);color:var(--accent);font-weight:600}
#theme-toggle{font-size:18px;padding:6px;border-radius:6px;transition:all var(--transition)}#theme-toggle:hover{background:var(--bg-hover)}
/* Messages */
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:4px}
#messages::-webkit-scrollbar{width:6px}#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.welcome{text-align:center;padding:60px 20px;max-width:650px;margin:auto}
.welcome h1{font-size:28px;font-weight:700;margin-bottom:12px;background:linear-gradient(135deg,var(--accent),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:24px}
.suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;max-width:500px;margin:0 auto}
.suggestion{padding:14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all var(--transition);text-align:left}
.suggestion:hover{border-color:var(--accent);background:var(--accent-dim);color:var(--text-primary)}
.msg{max-width:800px;width:100%;margin:0 auto;padding:16px 0;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{padding:12px 0}
.msg.user .msg-content{background:var(--bg-user-msg);border-radius:var(--radius) var(--radius) 4px var(--radius);padding:12px 16px;display:inline-block;max-width:85%;float:right;clear:both}
.msg.assistant .msg-content{line-height:1.7;font-size:15px}
.msg.assistant .msg-content p{margin-bottom:12px}
.msg.assistant .msg-content p:last-child{margin-bottom:0}
.msg.assistant .msg-content ul,.msg.assistant .msg-content ol{margin:8px 0 12px 20px}
.msg.assistant .msg-content li{margin-bottom:4px}
.msg.assistant .msg-content h1,.msg.assistant .msg-content h2,.msg.assistant .msg-content h3{margin:16px 0 8px;font-weight:600}
.msg.assistant .msg-content h1{font-size:22px}.msg.assistant .msg-content h2{font-size:18px}.msg.assistant .msg-content h3{font-size:16px}
.msg.assistant .msg-content a{color:var(--accent)}
.msg.assistant .msg-content blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-secondary);margin:8px 0}
.msg .msg-role{font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
/* Code blocks */
.code-block{position:relative;margin:12px 0;border-radius:var(--radius-sm);overflow:hidden;background:#0d1117;border:1px solid #21262d}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#161b22;font-size:12px;color:#8b949e}
.copy-btn{font-size:11px;padding:4px 10px;border-radius:4px;color:#8b949e;background:transparent;transition:all var(--transition)}.copy-btn:hover{background:#30363d;color:#e6edf3}
.copy-btn.copied{color:var(--success)}
.code-block pre{margin:0;padding:16px;overflow-x:auto;font-size:13px;line-height:1.6;font-family:var(--font-mono)}
.code-block code{font-family:var(--font-mono)}
/* Inline code */
.msg-content code:not(pre code){background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;font-family:var(--font-mono)}
/* Tool calls */
.tool-block{margin:8px 0;border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden}
.tool-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-tertiary);font-size:13px;font-weight:500;cursor:pointer}
.tool-header .icon{font-size:16px}
.tool-body{padding:10px 12px;font-size:13px;font-family:var(--font-mono);color:var(--text-secondary);max-height:200px;overflow-y:auto;display:none;background:var(--bg-primary)}
.tool-block.open .tool-body{display:block}
.tool-status{font-size:11px;margin-left:auto;padding:2px 8px;border-radius:4px}
.tool-status.success{color:var(--success);background:rgba(34,197,94,0.1)}
.tool-status.error{color:var(--error);background:rgba(239,68,68,0.1)}
/* Streaming cursor */
.cursor{display:inline-block;width:2px;height:18px;background:var(--accent);animation:blink 1s step-end infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes blink{50%{opacity:0}}
/* Input area */
#input-area{padding:16px 20px 20px;background:var(--bg-secondary);border-top:1px solid var(--border)}
#input-wrapper{max-width:800px;margin:0 auto;position:relative}
#input-box{display:flex;align-items:flex-end;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);padding:8px;transition:border var(--transition);gap:8px}
#input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
#msg-input{flex:1;border:none;background:transparent;resize:none;font-size:15px;line-height:1.5;max-height:180px;min-height:24px;padding:4px 8px;outline:none;color:var(--text-primary)}
#msg-input::placeholder{color:var(--text-muted)}
.input-actions{display:flex;align-items:center;gap:4px}
.input-actions button{padding:8px;border-radius:8px;font-size:18px;transition:all var(--transition);color:var(--text-muted)}.input-actions button:hover{background:var(--bg-hover);color:var(--text-primary)}
#send-btn{background:var(--accent);color:white;border-radius:8px;padding:8px 10px;transition:all var(--transition)}#send-btn:hover{background:var(--accent-hover)}#send-btn:disabled{opacity:.4;cursor:not-allowed}
/* File uploads */
.upload-preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;max-width:800px;margin-left:auto;margin-right:auto}
.upload-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;animation:fadeIn .2s ease}
.upload-chip img{width:32px;height:32px;border-radius:4px;object-fit:cover}
.upload-chip .remove{cursor:pointer;color:var(--text-muted);font-size:14px;padding:2px}.upload-chip .remove:hover{color:var(--error)}
#drop-overlay{position:fixed;inset:0;background:rgba(139,92,246,0.08);border:3px dashed var(--accent);z-index:1000;display:none;align-items:center;justify-content:center;font-size:20px;color:var(--accent);font-weight:600;backdrop-filter:blur(4px)}
#drop-overlay.active{display:flex}
/* Settings modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease;backdrop-filter:blur(2px)}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);width:90%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow);padding:24px}
.modal h2{font-size:20px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.modal-section{margin-bottom:20px}
.modal-section label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px}
.modal-section input,.modal-section select,.modal-section textarea{width:100%}
.modal-section textarea{min-height:80px;resize:vertical}
.modal-section .range-wrapper{display:flex;align-items:center;gap:12px}
.modal-section input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--border);border-radius:4px;border:none;padding:0}
.modal-section input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer}
.modal-section .range-value{font-size:13px;color:var(--text-primary);min-width:40px;text-align:right;font-family:var(--font-mono)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
/* Model select in modal */
.model-grid{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.model-option{padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;border-bottom:1px solid var(--border);transition:all var(--transition)}
.model-option:last-child{border-bottom:none}
.model-option:hover{background:var(--bg-hover)}
.model-option.selected{background:var(--accent-dim);color:var(--accent)}
.model-option .tags{display:flex;gap:4px}
.model-option .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg-hover);color:var(--text-muted)}
/* Responsive */
@media(max-width:768px){#sidebar{position:fixed;left:0;top:0;height:100vh;z-index:150}#sidebar.collapsed{transform:translateX(-100%)}:root{--sidebar-w:260px}.welcome h1{font-size:22px}.msg{padding:8px 0}}
</style>
</head>
<body>

<div id="drop-overlay">📁 Drop files here</div>

<aside id="sidebar" class="collapsed">
  <div class="sidebar-header">
    <div class="sidebar-logo">🔥 <span>ForgeAI</span></div>
    <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>
  <div class="sessions-list" id="sessions-list"></div>
  <div class="sidebar-footer">
    <button class="btn btn-ghost btn-sm" onclick="openSettings()">⚙️ Settings</button>
    <button class="btn btn-ghost btn-sm" onclick="exportSession()">📤 Export</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-input').click()">📥 Import</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importSession(event)">
  </div>
</aside>

<main id="main">
  <div id="topbar">
    <div class="left">
      <button id="toggle-sidebar" onclick="toggleSidebar()">☰</button>
      <div id="model-display">
        <span class="model-name" id="current-model-label">Auto</span>
        <span class="auto-badge" id="auto-badge">AUTO</span>
      </div>
    </div>
    <div class="right">
      <button class="btn btn-ghost btn-sm" onclick="openSettings()">⚙️</button>
      <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <div id="messages">
    <div class="welcome" id="welcome">
      <h1>Welcome to ForgeAI</h1>
      <p>Your AI-powered development workspace. Ask anything, upload files, execute commands, and more.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="sendSuggestion('help me debug my Python code')">🐛 Debug my code</div>
        <div class="suggestion" onclick="sendSuggestion('create a REST API with FastAPI')">🚀 Build an API</div>
        <div class="suggestion" onclick="sendSuggestion('explain how Docker works')">📦 Explain Docker</div>
        <div class="suggestion" onclick="sendSuggestion('write a bash script to backup my files')">📝 Write a script</div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="upload-preview" id="upload-preview"></div>
    <div id="input-wrapper">
      <div id="input-box">
        <button class="input-actions" onclick="document.getElementById('file-input').click()" title="Upload file">📎</button>
        <input type="file" id="file-input" multiple style="display:none" onchange="handleFileUpload(event)">
        <textarea id="msg-input" placeholder="Message ForgeAI..." rows="1" onkeydown="handleInputKey(event)" oninput="autoResizeInput()"></textarea>
        <div class="input-actions">
          <button id="send-btn" onclick="sendMessage()" title="Send (Enter)">➤</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙️ Settings</h2>

    <div class="modal-section">
      <label>Model Selection</label>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="auto-model-toggle" onchange="toggleAutoModel()" checked> Auto-select model
        </label>
      </div>
      <div class="model-grid" id="model-grid"></div>
    </div>

    <div class="modal-section">
      <label>Temperature</label>
      <div class="range-wrapper">
        <input type="range" id="temp-slider" min="0" max="1" step="0.05" value="0.2" oninput="document.getElementById('temp-val').textContent=this.value">
        <span class="range-value" id="temp-val">0.2</span>
      </div>
    </div>

    <div class="modal-section">
      <label>Max Tokens</label>
      <div class="range-wrapper">
        <input type="range" id="tokens-slider" min="256" max="16384" step="256" value="4096" oninput="document.getElementById('tokens-val').textContent=this.value">
        <span class="range-value" id="tokens-val">4096</span>
      </div>
    </div>

    <div class="modal-section">
      <label>System Prompt (leave empty for default)</label>
      <textarea id="system-prompt-input" placeholder="Custom system prompt..."></textarea>
    </div>

    <div class="modal-section">
      <label>NVIDIA API Key</label>
      <input type="password" id="api-key-input" placeholder="nvapi-...">
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let ws = null;
let currentSession = null;
let sessions = [];
let settings = {model:'auto',auto_model:true,temperature:0.2,max_tokens:4096,theme:'dark'};
let uploadedFiles = [];
let isStreaming = false;
let streamContent = '';
let streamEl = null;
const API = window.location.origin;

// ── Init ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await loadSettings();
  await loadSessions();
  connectWS();
  setupDragDrop();
  applyTheme();
  buildModelGrid();
  document.getElementById('msg-input').focus();
});

// ── WebSocket ──────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.onopen = () => console.log('WS connected');
  ws.onclose = () => { console.log('WS closed'); setTimeout(connectWS, 2000); };
  ws.onerror = (e) => console.error('WS error', e);
  ws.onmessage = (e) => handleWSMessage(JSON.parse(e.data));
}

function handleWSMessage(data) {
  const t = data.type;
  if (t === 'auto_model') {
    updateModelDisplay(data.model, data.intent);
  } else if (t === 'status') {
    showStatus(data.text);
  } else if (t === 'content_delta') {
    appendStreamContent(data.content);
  } else if (t === 'content_done') {
    finalizeStream();
  } else if (t === 'tool_exec') {
    addToolCall(data);
  } else if (t === 'tool_result') {
    addToolResult(data);
  } else if (t === 'error') {
    addErrorMessage(data.text);
    finishResponse();
  } else if (t === 'done') {
    finishResponse();
  }
}

// ── Send Message ───────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && uploadedFiles.length === 0) return;
  if (isStreaming) return;
  if (!ws || ws.readyState !== 1) { connectWS(); return; }

  // Ensure session
  if (!currentSession) await newChat();

  // Remove welcome
  const welc = document.getElementById('welcome');
  if (welc) welc.remove();

  // Show user message
  addUserMessage(text);
  input.value = '';
  autoResizeInput();

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  // Send via WS
  ws.send(JSON.stringify({
    type: 'message',
    content: text,
    session_id: currentSession,
    model: settings.auto_model ? 'auto' : settings.model,
    files: uploadedFiles,
  }));

  // Clear uploads
  uploadedFiles = [];
  document.getElementById('upload-preview').innerHTML = '';

  // Start assistant bubble
  startStream();
}

function sendSuggestion(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

// ── Message Rendering ──────────────────────────────────────
function addUserMessage(text) {
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-role">You</div><div class="msg-content">${escapeHtml(text)}</div>`;
  m.appendChild(div);
  scrollToBottom();
}

function startStream() {
  streamContent = '';
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'streaming-msg';
  div.innerHTML = `<div class="msg-role">ForgeAI</div><div class="msg-content"><span class="cursor"></span></div>`;
  m.appendChild(div);
  streamEl = div.querySelector('.msg-content');
  scrollToBottom();
}

function appendStreamContent(chunk) {
  streamContent += chunk;
  if (streamEl) {
    streamEl.innerHTML = renderMarkdown(streamContent) + '<span class="cursor"></span>';
    scrollToBottom();
  }
}

function finalizeStream() {
  if (streamEl && streamContent) {
    streamEl.innerHTML = renderMarkdown(streamContent);
    addCopyButtons(streamEl);
  }
  streamContent = '';
  streamEl = null;
}

function addToolCall(data) {
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  const argsStr = Object.entries(data.args||{}).map(([k,v])=>{
    let vs = String(v); if(vs.length>120) vs=vs.slice(0,120)+'…';
    return `<b>${escapeHtml(k)}</b>: ${escapeHtml(vs)}`;
  }).join('<br>');
  div.innerHTML = `<div class="tool-block" onclick="this.classList.toggle('open')">
    <div class="tool-header"><span class="icon">🔧</span> ${escapeHtml(data.name)} <span class="tool-status" style="color:var(--warning)">running…</span></div>
    <div class="tool-body">${argsStr||'(no arguments)'}</div>
  </div>`;
  div.id = `tool-${data.tool_id}`;
  m.appendChild(div);
  scrollToBottom();
}

function addToolResult(data) {
  const el = document.getElementById(`tool-${data.tool_id}`);
  const success = data.result && data.result.success;
  const output = data.result ? (data.result.output||'') : '';
  if (el) {
    const status = el.querySelector('.tool-status');
    if (status) {
      status.textContent = success ? '✓ done' : '✗ failed';
      status.className = `tool-status ${success ? 'success' : 'error'}`;
    }
    const body = el.querySelector('.tool-body');
    if (body && output) {
      body.innerHTML += `<hr style="border-color:var(--border);margin:8px 0"><pre style="white-space:pre-wrap;font-size:12px">${escapeHtml(output.slice(0,500))}${output.length>500?'\n…(truncated)':''}</pre>`;
    }
  }
  scrollToBottom();
}

function addErrorMessage(text) {
  finalizeStream();
  const m = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="msg-role">ForgeAI</div><div class="msg-content" style="color:var(--error)">❌ ${escapeHtml(text)}</div>`;
  m.appendChild(div);
  scrollToBottom();
}

function showStatus(text) {
  // Update streaming msg area if active
  if (streamEl && !streamContent) {
    streamEl.innerHTML = `<span style="color:var(--text-muted);font-style:italic">⏳ ${escapeHtml(text)}</span>`;
  }
}

function finishResponse() {
  finalizeStream();
  isStreaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
  const el = document.getElementById('streaming-msg');
  if (el) el.removeAttribute('id');
  loadSessions(); // refresh sidebar
}

// ── Markdown Rendering ─────────────────────────────────────
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, {language: lang}).value; } catch(e) {}
    }
    try { return hljs.highlightAuto(code).value; } catch(e) {}
    return code;
  }
});

function renderMarkdown(text) {
  if (!text) return '';
  let html = marked.parse(text);
  // Wrap code blocks with header
  html = html.replace(/<pre><code class="language-(\w+)">/g, (m, lang) => {
    return `<div class="code-block"><div class="code-header"><span>${lang}</span><button class="copy-btn" onclick="copyCode(this)">📋 Copy</button></div><pre><code class="language-${lang}">`;
  });
  html = html.replace(/<pre><code>/g, () => {
    return `<div class="code-block"><div class="code-header"><span>code</span><button class="copy-btn" onclick="copyCode(this)">📋 Copy</button></div><pre><code>`;
  });
  html = html.replace(/<\/code><\/pre>/g, '</code></pre></div>');
  return html;
}

function addCopyButtons(el) {
  // Already handled in renderMarkdown
}

function copyCode(btn) {
  const pre = btn.closest('.code-block').querySelector('code');
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── Sessions ───────────────────────────────────────────────
async function loadSessions() {
  try {
    const r = await fetch(`${API}/api/sessions`);
    const d = await r.json();
    sessions = d.sessions || [];
    renderSessions();
  } catch(e) { console.error('Failed to load sessions', e); }
}

function renderSessions() {
  const list = document.getElementById('sessions-list');
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id===currentSession?'active':''}" onclick="loadSession('${s.id}')">
      <span class="title">${escapeHtml(s.title)}</span>
      <button class="delete-btn" onclick="event.stopPropagation();deleteSession('${s.id}')">✕</button>
    </div>
  `).join('');
}

async function newChat() {
  try {
    const r = await fetch(`${API}/api/sessions`, {method:'POST'});
    const d = await r.json();
    currentSession = d.session_id;
    document.getElementById('messages').innerHTML = `
      <div class="welcome" id="welcome">
        <h1>Welcome to ForgeAI</h1>
        <p>Your AI-powered development workspace.</p>
        <div class="suggestions">
          <div class="suggestion" onclick="sendSuggestion('help me debug my Python code')">🐛 Debug my code</div>
          <div class="suggestion" onclick="sendSuggestion('create a REST API')">🚀 Build an API</div>
          <div class="suggestion" onclick="sendSuggestion('explain Docker')">📦 Explain Docker</div>
          <div class="suggestion" onclick="sendSuggestion('write a bash script')">📝 Write a script</div>
        </div>
      </div>`;
    await loadSessions();
  } catch(e) { console.error('Failed to create session', e); }
}

async function loadSession(sid) {
  try {
    const r = await fetch(`${API}/api/sessions/${sid}`);
    const d = await r.json();
    currentSession = sid;
    const m = document.getElementById('messages');
    m.innerHTML = '';
    for (const msg of d.messages) {
      if (msg.role === 'user') {
        addUserMessage(msg.content || '');
      } else if (msg.role === 'assistant' && msg.content) {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.innerHTML = `<div class="msg-role">ForgeAI</div><div class="msg-content">${renderMarkdown(msg.content)}</div>`;
        m.appendChild(div);
      }
    }
    scrollToBottom();
    renderSessions();
  } catch(e) { console.error('Failed to load session', e); }
}

async function deleteSession(sid) {
  if (!confirm('Delete this conversation?')) return;
  try {
    await fetch(`${API}/api/sessions/${sid}`, {method:'DELETE'});
    if (currentSession === sid) { currentSession = null; document.getElementById('messages').innerHTML = ''; }
    await loadSessions();
  } catch(e) { console.error(e); }
}

async function exportSession() {
  if (!currentSession) return;
  window.open(`${API}/api/sessions/${currentSession}/export`);
}

async function importSession(event) {
  const file = event.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const r = await fetch(`${API}/api/sessions/import`, {method:'POST', body:form});
    const d = await r.json();
    await loadSessions();
    await loadSession(d.session_id);
  } catch(e) { console.error(e); }
  event.target.value = '';
}

// ── Settings ───────────────────────────────────────────────
async function loadSettings() {
  try {
    const r = await fetch(`${API}/api/settings`);
    settings = await r.json();
    applySettings();
  } catch(e) { console.error(e); }
}

function applySettings() {
  document.getElementById('auto-model-toggle').checked = settings.auto_model !== false;
  document.getElementById('temp-slider').value = settings.temperature || 0.2;
  document.getElementById('temp-val').textContent = settings.temperature || 0.2;
  document.getElementById('tokens-slider').value = settings.max_tokens || 4096;
  document.getElementById('tokens-val').textContent = settings.max_tokens || 4096;
  document.getElementById('system-prompt-input').value = settings.system_prompt || '';
  document.getElementById('api-key-input').value = settings.api_key || '';
  if (settings.theme) { document.documentElement.setAttribute('data-theme', settings.theme); }
  updateModelDisplay(settings.model || 'auto', null);
}

function openSettings() { document.getElementById('settings-modal').classList.add('active'); buildModelGrid(); }
function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }

async function saveSettings() {
  settings.auto_model = document.getElementById('auto-model-toggle').checked;
  settings.temperature = parseFloat(document.getElementById('temp-slider').value);
  settings.max_tokens = parseInt(document.getElementById('tokens-slider').value);
  settings.system_prompt = document.getElementById('system-prompt-input').value;
  settings.api_key = document.getElementById('api-key-input').value;
  settings.theme = document.documentElement.getAttribute('data-theme');
  // Get selected model from grid
  const sel = document.querySelector('.model-option.selected');
  if (sel) settings.model = sel.dataset.model;
  try {
    await fetch(`${API}/api/settings`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(settings)
    });
  } catch(e) { console.error(e); }
  updateModelDisplay(settings.model, null);
  closeSettings();
}

function toggleAutoModel() {
  const auto = document.getElementById('auto-model-toggle').checked;
  document.getElementById('model-grid').style.opacity = auto ? '0.5' : '1';
  document.getElementById('model-grid').style.pointerEvents = auto ? 'none' : 'auto';
}

async function buildModelGrid() {
  try {
    const r = await fetch(`${API}/api/models`);
    const d = await r.json();
    const grid = document.getElementById('model-grid');
    grid.innerHTML = d.models.filter(m=>!m.tags.includes('embeddings')).map(m => `
      <div class="model-option ${m.id===settings.model?'selected':''}" data-model="${m.id}" onclick="selectModel(this,'${m.id}')">
        <span>${m.id.split('/').pop()}</span>
        <span class="tags">${m.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}</span>
      </div>
    `).join('');
    toggleAutoModel();
  } catch(e) { console.error(e); }
}

function selectModel(el, model) {
  document.querySelectorAll('.model-option').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
}

function updateModelDisplay(model, intent) {
  const label = document.getElementById('current-model-label');
  const badge = document.getElementById('auto-badge');
  if (settings.auto_model) {
    const short = model && model !== 'auto' ? model.split('/').pop() : 'Auto';
    label.textContent = short;
    badge.style.display = 'inline';
    if (intent) badge.textContent = intent.toUpperCase();
    else badge.textContent = 'AUTO';
  } else {
    const m = settings.model || 'auto';
    label.textContent = m === 'auto' ? 'Auto' : m.split('/').pop();
    badge.style.display = 'none';
  }
}

// ── Theme ──────────────────────────────────────────────────
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
  settings.theme = next;
}

function applyTheme() {
  const t = settings.theme || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-toggle').textContent = t === 'dark' ? '🌙' : '☀️';
}

// ── File Upload ────────────────────────────────────────────
async function handleFileUpload(event) {
  const files = event.target.files;
  for (const file of files) {
    await uploadFile(file);
  }
  event.target.value = '';
}

async function uploadFile(file) {
  const form = new FormData();
  form.append('file', file);
  try {
    const r = await fetch(`${API}/api/upload`, {method:'POST', body:form});
    if (!r.ok) { alert('Upload failed'); return; }
    const d = await r.json();
    uploadedFiles.push(d);
    renderUploadPreview();
  } catch(e) { console.error(e); alert('Upload failed'); }
}

function renderUploadPreview() {
  const container = document.getElementById('upload-preview');
  container.innerHTML = uploadedFiles.map((f, i) => {
    const img = f.is_image ? `<img src="${API}/api/uploads/${f.file_id}" alt="">` : '📄';
    return `<div class="upload-chip">${img} <span>${escapeHtml(f.filename)}</span> <span class="remove" onclick="removeUpload(${i})">✕</span></div>`;
  }).join('');
}

function removeUpload(idx) {
  uploadedFiles.splice(idx, 1);
  renderUploadPreview();
}

function setupDragDrop() {
  const overlay = document.getElementById('drop-overlay');
  let dragCount = 0;
  document.addEventListener('dragenter', (e) => { e.preventDefault(); dragCount++; overlay.classList.add('active'); });
  document.addEventListener('dragleave', (e) => { e.preventDefault(); dragCount--; if(dragCount<=0){overlay.classList.remove('active');dragCount=0;} });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', async (e) => {
    e.preventDefault(); dragCount=0; overlay.classList.remove('active');
    for (const file of e.dataTransfer.files) { await uploadFile(file); }
  });
}

// ── Sidebar ────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ── Input ──────────────────────────────────────────────────
function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  if (e.key === 'n' && (e.ctrlKey || e.metaKey) && e.shiftKey) { e.preventDefault(); newChat(); }
}

function autoResizeInput() {
  const el = document.getElementById('msg-input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

// ── Utilities ──────────────────────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scrollToBottom() {
  const m = document.getElementById('messages');
  requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSettings();
  if (e.key === '/' && !isStreaming && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('msg-input').focus();
  }
});
</script>
