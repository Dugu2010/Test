<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForgeAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>	ml	ml	ml🔥</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#08080f;--bg1:#0e0e1a;--bg2:#151522;--bg3:#1c1c30;--bg4:#24243e;--bg-hover:#2a2a48;--border:#252542;--border-hover:#35355a;--text:#e4e4f0;--text2:#9090b0;--text3:#606080;--accent:#8b6cf6;--accent2:#7c5ce6;--accent-dim:rgba(139,108,246,.12);--accent-glow:rgba(139,108,246,.25);--green:#34d058;--red:#f24c4c;--amber:#f0a030;--radius:14px;--radius-s:10px;--radius-xs:6px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace;--sidebar:270px;--ease:cubic-bezier(.4,0,.2,1)}
[data-theme=light]{--bg0:#f5f5fb;--bg1:#ffffff;--bg2:#f0f0f8;--bg3:#e8e8f4;--bg4:#ddddef;--bg-hover:#d0d0e8;--border:#d8d8eb;--border-hover:#c0c0d8;--text:#18182a;--text2:#555570;--text3:#9090a8;--accent-dim:rgba(139,108,246,.08)}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg0);color:var(--text);display:flex}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font);background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 12px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
a{color:var(--accent);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-xs);font-size:13px;font-weight:500;transition:all .2s var(--ease)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{color:var(--text2)}.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12px}
/* Sidebar */
#sb{width:var(--sidebar);min-width:var(--sidebar);height:100vh;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s var(--ease),min-width .3s var(--ease);z-index:100}
#sb.hide{transform:translateX(calc(-1*var(--sidebar)));min-width:0;width:0;overflow:hidden}
.sb-head{padding:16px;border-bottom:1px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sb-logo b{font-size:17px;background:linear-gradient(135deg,var(--accent),#d946ef);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#nc-btn{width:100%;padding:10px;border-radius:var(--radius-s);border:1px dashed var(--border);color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s var(--ease)}#nc-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.sl{flex:1;overflow-y:auto;padding:8px 8px}.sl::-webkit-scrollbar{width:4px}.sl::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sl .g-label{font-size:11px;color:var(--text3);font-weight:600;padding:10px 8px 4px;text-transform:uppercase;letter-spacing:.5px}
.si{padding:9px 10px;border-radius:var(--radius-xs);cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:1px;font-size:13px;color:var(--text2);transition:all .15s var(--ease)}
.si:hover{background:var(--bg-hover);color:var(--text)}
.si.active{background:var(--accent-dim);color:var(--text);border-left:3px solid var(--accent)}
.si .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .x{opacity:0;font-size:11px;padding:2px 4px;border-radius:4px;color:var(--text3);transition:all .15s}.si:hover .x{opacity:1}.si .x:hover{color:var(--red);background:rgba(242,76,76,.1)}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:6px}
.sb-foot button{flex:1;font-size:11px}
/* Main */
#mn{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
#tb{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;min-height:48px;background:var(--bg1)}
#tb .l{display:flex;align-items:center;gap:10px;flex:1}
#tb .r{display:flex;align-items:center;gap:6px}
#tg-sb{font-size:17px;padding:5px;border-radius:6px;transition:all .15s}#tg-sb:hover{background:var(--bg-hover)}
#mdl-d{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px}
#mdl-d .n{color:var(--text);font-weight:500}
.abadge{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--accent-dim);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
#tg-th{font-size:17px;padding:5px;border-radius:6px;transition:all .15s}#tg-th:hover{background:var(--bg-hover)}
/* Messages */
#msgs{flex:1;overflow-y:auto;padding:0;display:flex;flex-direction:column}
#msgs::-webkit-scrollbar{width:5px}#msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.mi{max-width:780px;width:100%;margin:0 auto;padding:0 20px}
.welcome{text-align:center;padding:80px 20px;max-width:600px;margin:auto}
.welcome h1{font-size:32px;font-weight:800;margin-bottom:10px;background:linear-gradient(135deg,var(--accent),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text2);font-size:15px;line-height:1.7;margin-bottom:28px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:0 auto}
.sug{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-s);cursor:pointer;font-size:13px;color:var(--text2);transition:all .2s var(--ease);text-align:left}
.sug:hover{border-color:var(--accent);background:var(--accent-dim);color:var(--text);transform:translateY(-1px)}
.mg{padding:20px 0;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mg.u{background:transparent}
.mg.u .mc{background:var(--bg3);border-radius:var(--radius) var(--radius) 4px var(--radius);padding:12px 16px;display:inline-block;max-width:80%;float:right;clear:both}
.mg.a{background:var(--bg1);border-bottom:1px solid var(--border)}
.mg.a .mc{line-height:1.75;font-size:15px}
.mg.a .mc p{margin-bottom:10px}.mg.a .mc p:last-child{margin-bottom:0}
.mg.a .mc ul,.mg.a .mc ol{margin:8px 0 10px 20px}.mg.a .mc li{margin-bottom:3px}
.mg.a .mc h1,.mg.a .mc h2,.mg.a .mc h3{margin:16px 0 8px;font-weight:600}
.mg.a .mc h1{font-size:22px}.mg.a .mc h2{font-size:18px}.mg.a .mc h3{font-size:15px}
.mg.a .mc blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text2);margin:8px 0}
.mg.a .mc table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
.mg.a .mc th,.mg.a .mc td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.mg.a .mc th{background:var(--bg3)}
.mr{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
/* Code */
.cb{position:relative;margin:12px 0;border-radius:var(--radius-s);overflow:hidden;background:#0d1117;border:1px solid #1b2230}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:#161b22;font-size:12px;color:#7a8599}
.cpb{font-size:11px;padding:3px 8px;border-radius:4px;color:#7a8599;transition:all .15s}.cpb:hover{background:#2a3040;color:#c8d0dc}
.cpb.ok{color:var(--green)}
.cb pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.55;font-family:var(--mono)}
.cb code{font-family:var(--mono)}
.mc code:not(pre code){background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:13px;font-family:var(--mono)}
/* Tool */
.tb{margin:8px 0;border-radius:var(--radius-xs);border:1px solid var(--border);overflow:hidden}
.th{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--bg3);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.th:hover{background:var(--bg4)}
.th .ic{font-size:15px}
.tbd{padding:8px 10px;font-size:12px;font-family:var(--mono);color:var(--text2);max-height:180px;overflow-y:auto;display:none;background:var(--bg0)}
.tb.open .tbd{display:block}
.ts{font-size:10px;margin-left:auto;padding:2px 7px;border-radius:4px}
.ts.ok{color:var(--green);background:rgba(52,208,88,.1)}
.ts.err{color:var(--red);background:rgba(242,76,76,.1)}
/* Streaming */
.cur{display:inline-block;width:2px;height:17px;background:var(--accent);animation:bk 1s step-end infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes bk{50%{opacity:0}}
/* Input */
#ia{padding:14px 20px 18px;background:var(--bg1);border-top:1px solid var(--border)}
#iw{max-width:780px;margin:0 auto;position:relative}
#ib{display:flex;align-items:flex-end;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg2);padding:6px 8px;transition:all .2s var(--ease);gap:6px}
#ib:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
#mi{flex:1;border:none;background:transparent;resize:none;font-size:15px;line-height:1.5;max-height:160px;min-height:24px;padding:6px 8px;outline:none;color:var(--text)}
#mi::placeholder{color:var(--text3)}
#sb-btn{background:var(--accent);color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center}#sb-btn:hover{background:var(--accent2);transform:scale(1.05)}#sb-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.ia-btn{font-size:18px;padding:6px;border-radius:8px;color:var(--text3);transition:all .15s}.ia-btn:hover{background:var(--bg-hover);color:var(--text)}
/* Upload */
.up{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;max-width:780px;margin-left:auto;margin-right:auto}
.uc{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;animation:fi .2s ease}
.uc img{width:28px;height:28px;border-radius:4px;object-fit:cover}
.uc .rm{cursor:pointer;color:var(--text3);font-size:13px;padding:1px}.uc .rm:hover{color:var(--red)}
#dov{position:fixed;inset:0;border:3px dashed var(--accent);z-index:1000;display:none;align-items:center;justify-content:center;font-size:18px;color:var(--accent);font-weight:600;backdrop-filter:blur(6px);background:rgba(139,108,246,.06)}#dov.on{display:flex}
/* Settings drawer */
.dr-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;justify-content:flex-end;backdrop-filter:blur(2px)}.dr-ov.on{display:flex}
.dr{width:400px;max-width:92vw;height:100vh;background:var(--bg1);border-left:1px solid var(--border);padding:28px 24px;overflow-y:auto;animation:slideL .3s var(--ease)}
@keyframes slideL{from{transform:translateX(100%)}to{transform:none}}
.dr h2{font-size:20px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.dr-sec{margin-bottom:18px}
.dr-sec label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.dr-sec input,.dr-sec select,.dr-sec textarea{width:100%}
.dr-sec textarea{min-height:80px;resize:vertical;font-family:var(--mono);font-size:12px}
.rw{display:flex;align-items:center;gap:10px}
.rw input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--border);border-radius:4px;border:none;padding:0}
.rw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
.rv{font-size:12px;color:var(--text);min-width:36px;text-align:right;font-family:var(--mono)}
.dr-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.mg-grid{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-xs)}
.mo{padding:7px 10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12px;border-bottom:1px solid var(--border);transition:all .15s}
.mo:last-child{border-bottom:none}
.mo:hover{background:var(--bg-hover)}
.mo.sel{background:var(--accent-dim);color:var(--accent)}
.mo .tg{display:flex;gap:3px}.mo .tg span{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg-hover);color:var(--text3)}
/* Toggle */
.sw{position:relative;width:38px;height:20px;border-radius:10px;background:var(--border);cursor:pointer;transition:background .2s;border:none}
.sw::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
/* Responsive */
@media(max-width:768px){#sb{position:fixed;left:0;top:0;height:100vh;z-index:150}#sb.hide{transform:translateX(-100%)}:root{--sidebar:260px}.sugs{grid-template-columns:1fr}.mg{padding:12px 0}}
</style>
</head>
<body>
<div id="dov">📁 Drop files here</div>

<aside id="sb" class="hide">
  <div class="sb-head">
    <div class="sb-logo">🔥 <b>ForgeAI</b></div>
    <button id="nc-btn" onclick="newChat()">+ New Chat</button>
  </div>
  <div class="sl" id="sl"></div>
  <div class="sb-foot">
    <button class="btn btn-ghost btn-sm" onclick="openDr()">⚙️ Settings</button>
    <button class="btn btn-ghost btn-sm" onclick="exportS()">📤</button>
    <button class="btn btn-ghost btn-sm" onclick="$('imp-f').click()">📥</button>
    <input type="file" id="imp-f" accept=".json" style="display:none" onchange="importS(event)">
  </div>
</aside>

<main id="mn">
  <div id="tb">
    <div class="l">
      <button id="tg-sb" onclick="toggleSB()">☰</button>
      <div id="mdl-d"><span class="n" id="ml">Auto</span><span class="abadge" id="ab">AUTO</span></div>
    </div>
    <div class="r">
      <button class="btn btn-ghost btn-sm" onclick="openDr()">⚙️</button>
      <button id="tg-th" onclick="toggleTh()">🌙</button>
    </div>
  </div>

  <div id="msgs">
    <div class="welcome" id="welc">
      <h1>ForgeAI</h1>
      <p>Your AI-powered development workspace. Ask anything, upload files, execute commands.</p>
      <div class="sugs">
        <div class="sug" onclick="qs('help me debug my code')">🐛 Debug my code</div>
        <div class="sug" onclick="qs('create a REST API with FastAPI')">🚀 Build an API</div>
        <div class="sug" onclick="qs('explain how Docker works')">📦 Explain Docker</div>
        <div class="sug" onclick="qs('write a backup script')">📝 Write a script</div>
      </div>
    </div>
  </div>

  <div id="ia">
    <div class="up" id="up"></div>
    <div id="iw">
      <div id="ib">
        <button class="ia-btn" onclick="$('fi').click()" title="Upload">📎</button>
        <input type="file" id="fi" multiple style="display:none" onchange="hfu(event)">
        <textarea id="mi" placeholder="Message ForgeAI..." rows="1" onkeydown="ik(event)" oninput="ar()"></textarea>
        <button id="sb-btn" onclick="send()" title="Send">➤</button>
      </div>
    </div>
  </div>
</main>

<div class="dr-ov" id="drov" onclick="if(event.target===this)closeDr()">
  <div class="dr">
    <h2>⚙️ Settings</h2>
    <div class="dr-sec">
      <label>Auto Model</label>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="sw on" id="am-sw" onclick="this.classList.toggle('on')"></button>
        <span style="font-size:13px;color:var(--text2)">Automatically select best model</span>
      </div>
    </div>
    <div class="dr-sec">
      <label>Model</label>
      <div class="mg-grid" id="mg"></div>
    </div>
    <div class="dr-sec">
      <label>Temperature</label>
      <div class="rw"><input type="range" id="t-sl" min="0" max="1" step=".05" value=".2" oninput="$('t-v').textContent=this.value"><span class="rv" id="t-v">0.2</span></div>
    </div>
    <div class="dr-sec">
      <label>Max Tokens</label>
      <div class="rw"><input type="range" id="tk-sl" min="256" max="16384" step="256" value="4096" oninput="$('tk-v').textContent=this.value"><span class="rv" id="tk-v">4096</span></div>
    </div>
    <div class="dr-sec">
      <label>System Prompt</label>
      <textarea id="sp-i" placeholder="Custom system prompt..."></textarea>
    </div>
    <div class="dr-sec">
      <label>API Key</label>
      <input type="password" id="ak-i" placeholder="nvapi-...">
    </div>
    <div class="dr-sec">
      <label>CLI Commands Reference</label>
      <div id="cli-cmds" style="font-size:12px;color:var(--text2);max-height:150px;overflow-y:auto;background:var(--bg0);border-radius:var(--radius-xs);padding:8px 10px;font-family:var(--mono)"></div>
    </div>
    <div class="dr-acts">
      <button class="btn btn-ghost" onclick="closeDr()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSt()">Save</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let ws,cSess,sess=[],st={model:'auto',auto_model:true,temperature:.2,max_tokens:4096,theme:'dark'},ufs=[],streaming=false,sCont='',sEl;
const API=location.origin;

document.addEventListener('DOMContentLoaded',async()=>{
  await ldSt();await ldSess();connWS();setupDD();apTh();bMG();ldCmds();
  $('mi').focus();
});

function connWS(){
  const p=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${p}://${location.host}/ws/chat`);
  ws.onopen=()=>console.log('ws ok');
  ws.onclose=()=>{console.log('ws closed');setTimeout(connWS,2e3)};
  ws.onerror=e=>console.error('ws err',e);
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
}

function onMsg(d){
  const t=d.type;
  if(t==='auto_model'){updMdl(d.model,d.intent)}
  else if(t==='status'){showSt(d.text)}
  else if(t==='content_delta'){appSC(d.content)}
  else if(t==='content_done'){finS()}
  else if(t==='tool_exec'){addTC(d)}
  else if(t==='tool_result'){addTR(d)}
  else if(t==='error'){addErr(d.text);finResp()}
  else if(t==='done'){finResp()}
}

async function send(){
  const inp=$('mi'),txt=inp.value.trim();
  if(!txt&&!ufs.length)return;if(streaming)return;
  if(!ws||ws.readyState!==1){connWS();return}
  if(!cSess)await newChat();
  const w=$('welc');if(w)w.remove();
  addUM(txt);inp.value='';ar();
  streaming=true;$('sb-btn').disabled=true;
  ws.send(JSON.stringify({type:'message',content:txt,session_id:cSess,model:st.auto_model?'auto':st.model,files:ufs}));
  ufs=[];$('up').innerHTML='';
  startS();
}

function qs(t){$('mi').value=t;send()}

function addUM(t){
  const d=ce('div');d.className='mg u';d.innerHTML=`<div class="mi"><div class="mr">You</div><div class="mc">${esc(t)}</div></div>`;
  $('msgs').appendChild(d);scr();
}

function startS(){
  sCont='';const d=ce('div');d.className='mg a';d.id='s-mg';
  d.innerHTML=`<div class="mi"><div class="mr">ForgeAI</div><div class="mc"><span class="cur"></span></div></div>`;
  $('msgs').appendChild(d);sEl=d.querySelector('.mc');scr();
}

function appSC(c){
  sCont+=c;
  if(sEl){sEl.innerHTML=rMD(sCont)+'<span class="cur"></span>';scr()}
}

function finS(){
  if(sEl&&sCont){sEl.innerHTML=rMD(sCont);addCB(sEl)}
  sCont='';sEl=null;
}

function addTC(d){
  const el=ce('div');el.className='mg a';el.id=`tc-${d.tool_id}`;
  const args=Object.entries(d.args||{}).map(([k,v])=>{let vs=String(v);if(vs.length>100)vs=vs.slice(0,100)+'…';return`<b>${esc(k)}</b>: ${esc(vs)}`}).join('<br>');
  el.innerHTML=`<div class="mi"><div class="tb" onclick="this.classList.toggle('open')"><div class="th"><span class="ic">🔧</span>${esc(d.name)}<span class="ts" style="color:var(--amber)">running…</span></div><div class="tbd">${args||'(no args)'}</div></div></div>`;
  $('msgs').appendChild(el);scr();
}

function addTR(d){
  const el=$(`tc-${d.tool_id}`);const ok=d.result&&d.result.success;const out=d.result?(d.result.output||''):'';
  if(el){
    const s=el.querySelector('.ts');if(s){s.textContent=ok?'✓ done':'✗ failed';s.className='ts '+(ok?'ok':'err')}
    const b=el.querySelector('.tbd');if(b&&out){b.innerHTML+=`<hr style="border-color:var(--border);margin:6px 0"><pre style="white-space:pre-wrap;font-size:11px">${esc(out.slice(0,400))}${out.length>400?'\n…':''}</pre>`}
  }
  scr();
}

function addErr(t){
  finS();const d=ce('div');d.className='mg a';
  d.innerHTML=`<div class="mi"><div class="mr">ForgeAI</div><div class="mc" style="color:var(--red)">❌ ${esc(t)}</div></div>`;
  $('msgs').appendChild(d);scr();
}

function showSt(t){if(sEl&&!sCont)sEl.innerHTML=`<span style="color:var(--text3);font-style:italic">${esc(t)}</span>`}

function finResp(){
  finS();streaming=false;$('sb-btn').disabled=false;$('mi').focus();
  const el=$('s-mg');if(el)el.id='';
  ldSess();
}

marked.setOptions({breaks:true,gfm:true,highlight:(c,l)=>{
  if(l&&hljs.getLanguage(l))try{return hljs.highlight(c,{language:l}).value}catch(e){}
  try{return hljs.highlightAuto(c).value}catch(e){}
  return c;
}});

function rMD(t){
  if(!t)return'';
  let h=marked.parse(t);
  h=h.replace(/<pre><code class="language-(\w+)">/g,(m,l)=>`<div class="cb"><div class="ch"><span>${l}</span><button class="cpb" onclick="cpC(this)">📋 Copy</button></div><pre><code class="language-${l}">`);
  h=h.replace(/<pre><code>/g,()=>`<div class="cb"><div class="ch"><span>code</span><button class="cpb" onclick="cpC(this)">📋 Copy</button></div><pre><code>`);
  h=h.replace(/<\/code><\/pre>/g,'</code></pre></div>');
  return h;
}

function addCB(el){/* handled in rMD */}
function cpC(b){const c=b.closest('.cb').querySelector('code');if(!c)return;navigator.clipboard.writeText(c.textContent).then(()=>{b.textContent='✓ Copied!';b.classList.add('ok');setTimeout(()=>{b.textContent='📋 Copy';b.classList.remove('ok')},2e3)})}

async function ldSess(){
  try{const r=await fetch(`${API}/api/sessions`);const d=await r.json();sess=d.sessions||[];rSess()}catch(e){}
}

function rSess(){
  const list=$('sl');if(!list)return;
  const now=new Date();const today=now.toDateString();const yday=new Date(now-864e5).toDateString();
  let groups={today:[],yesterday:[],older:[]};
  sess.forEach(s=>{
    const d=new Date(s.created);const ds=d.toDateString();
    if(ds===today)groups.today.push(s);else if(ds===yday)groups.yesterday.push(s);else groups.older.push(s);
  });
  let html='';
  if(groups.today.length){html+=`<div class="g-label">Today</div>`;groups.today.forEach(s=>{html+=si(s)})}
  if(groups.yesterday.length){html+=`<div class="g-label">Yesterday</div>`;groups.yesterday.forEach(s=>{html+=si(s)})}
  if(groups.older.length){html+=`<div class="g-label">Previous</div>`;groups.older.forEach(s=>{html+=si(s)})}
  list.innerHTML=html;
}

function si(s){return`<div class="si ${s.id===cSess?'active':''}" onclick="ldS('${s.id}')"><span class="t">${esc(s.title)}</span><button class="x" onclick="event.stopPropagation();delS('${s.id}')">✕</button></div>`}

async function newChat(){
  try{const r=await fetch(`${API}/api/sessions`,{method:'POST'});const d=await r.json();cSess=d.session_id;
  $('msgs').innerHTML=`<div class="welcome" id="welc"><h1>ForgeAI</h1><p>Your AI-powered development workspace.</p><div class="sugs"><div class="sug" onclick="qs('debug my code')">🐛 Debug</div><div class="sug" onclick="qs('create an API')">🚀 API</div><div class="sug" onclick="qs('explain Docker')">📦 Docker</div><div class="sug" onclick="qs('write a script')">📝 Script</div></div></div>`;
  await ldSess()}catch(e){}
}

async function ldS(sid){
  try{const r=await fetch(`${API}/api/sessions/${sid}`);const d=await r.json();cSess=sid;
  const m=$('msgs');m.innerHTML='';
  for(const msg of d.messages){
    if(msg.role==='user')addUM(msg.content||'');
    else if(msg.role==='assistant'&&msg.content){const dv=ce('div');dv.className='mg a';dv.innerHTML=`<div class="mi"><div class="mr">ForgeAI</div><div class="mc">${rMD(msg.content)}</div></div>`;m.appendChild(dv)}
  }
  scr();rSess()}catch(e){}
}

async function delS(sid){if(!confirm('Delete?'))return;try{await fetch(`${API}/api/sessions/${sid}`,{method:'DELETE'});if(cSess===sid){cSess=null;$('msgs').innerHTML=''}await ldSess()}catch(e){}}
async function exportS(){if(!cSess)return;window.open(`${API}/api/sessions/${cSess}/export`)}
async function importS(e){const f=e.target.files[0];if(!f)return;const fd=new FormData;fd.append('file',f);try{const r=await fetch(`${API}/api/sessions/import`,{method:'POST',body:fd});const d=await r.json();await ldSess();await ldS(d.session_id)}catch(e){}e.target.value=''}

async function ldSt(){try{const r=await fetch(`${API}/api/settings`);st=await r.json();apSt()}catch(e){}}
function apSt(){
  const am=$('am-sw');if(am){am.classList.toggle('on',st.auto_model!==false)}
  const ts=$('t-sl');if(ts){ts.value=st.temperature||.2;$('t-v').textContent=st.temperature||.2}
  const tk=$('tk-sl');if(tk){tk.value=st.max_tokens||4096;$('tk-v').textContent=st.max_tokens||4096}
  const sp=$('sp-i');if(sp)sp.value=st.system_prompt||'';
  const ak=$('ak-i');if(ak)ak.value=st.api_key||'';
  if(st.theme)document.documentElement.setAttribute('data-theme',st.theme);
  updMdl(st.model||'auto',null);
}

function openDr(){$('drov').classList.add('on');bMG()}
function closeDr(){$('drov').classList.remove('on')}

async function saveSt(){
  st.auto_model=$('am-sw').classList.contains('on');
  st.temperature=parseFloat($('t-sl').value);
  st.max_tokens=parseInt($('tk-sl').value);
  st.system_prompt=$('sp-i').value;
  st.api_key=$('ak-i').value;
  st.theme=document.documentElement.getAttribute('data-theme');
  const sel=document.querySelector('.mo.sel');if(sel)st.model=sel.dataset.m;
  try{await fetch(`${API}/api/settings`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(st)})}catch(e){}
  updMdl(st.model,null);closeDr();
}

async function bMG(){
  try{const r=await fetch(`${API}/api/models`);const d=await r.json();
  const g=$('mg');g.innerHTML=d.models.filter(m=>!m.tags.includes('embeddings')).map(m=>
    `<div class="mo ${m.id===st.model?'sel':''}" data-m="${m.id}" onclick="selM(this,'${m.id}')">
      <span>${m.id.split('/').pop()}</span>
      <span class="tg">${m.tags.slice(0,2).map(t=>`<span>${t}</span>`).join('')}</span>
    </div>`
  ).join('');
  const am=$('am-sw');const dis=am&&am.classList.contains('on');
  g.style.opacity=dis?'.5':'1';g.style.pointerEvents=dis?'none':'auto';
  }catch(e){}
}

function selM(el,m){document.querySelectorAll('.mo').forEach(e=>e.classList.remove('sel'));el.classList.add('sel')}

function updMdl(m,intent){
  const lbl=$('ml'),b=$('ab');if(!lbl)return;
  if(st.auto_model){const s=m&&m!=='auto'?m.split('/').pop():'Auto';lbl.textContent=s;b.style.display='inline';b.textContent=intent?intent.toUpperCase():'AUTO'}
  else{lbl.textContent=(st.model||'auto')==='auto'?'Auto':(st.model||'').split('/').pop();b.style.display='none'}
}

async function ldCmds(){
  try{const r=await fetch(`${API}/api/commands`);const d=await r.json();
  const el=$('cli-cmds');if(el)el.innerHTML=(d.commands||[]).map(c=>`<div style="margin-bottom:2px"><b style="color:var(--accent)">${esc(c.cmd)}</b> ${esc(c.desc)}</div>`).join('');
  }catch(e){}
}

function toggleTh(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);$('tg-th').textContent=n==='dark'?'🌙':'☀️';st.theme=n}
function apTh(){const t=st.theme||'dark';document.documentElement.setAttribute('data-theme',t);$('tg-th').textContent=t==='dark'?'🌙':'☀️'}

async function hfu(e){for(const f of e.target.files)await ulf(f);e.target.value=''}
async function ulf(f){const fd=new FormData;fd.append('file',f);try{const r=await fetch(`${API}/api/upload`,{method:'POST',body:fd});if(!r.ok){alert('Upload failed');return}const d=await r.json();ufs.push(d);rUP()}catch(e){alert('Upload failed')}}
function rUP(){const c=$('up');c.innerHTML=ufs.map((f,i)=>{const img=f.is_image?`<img src="${API}/api/uploads/${f.file_id}">`:'	ml📄';return`<div class="uc">${img}<span>${esc(f.filename)}</span><span class="rm" onclick="rmU(${i})">✕</span></div>`}).join('')}
function rmU(i){ufs.splice(i,1);rUP()}

function setupDD(){const ov=$('dov');let dc=0;
  document.addEventListener('dragenter',e=>{e.preventDefault();dc++;ov.classList.add('on')});
  document.addEventListener('dragleave',e=>{e.preventDefault();dc--;if(dc<=0){ov.classList.remove('on');dc=0}});
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',async e=>{e.preventDefault();dc=0;ov.classList.remove('on');for(const f of e.dataTransfer.files)await ulf(f)});
}

function toggleSB(){$('sb').classList.toggle('hide')}
function ik(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function ar(){const el=$('mi');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px'}
function ce(t){return document.createElement(t)}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function scr(){const m=$('msgs');requestAnimationFrame(()=>{m.scrollTop=m.scrollHeight})}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDr();
  if(e.key==='/'&&!streaming&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();$('mi').focus()}
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();newChat()}
  if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();openDr()}
  if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();toggleSB()}
});
</script>
